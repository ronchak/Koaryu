name: Issue 105 PR bootstrap

permissions:
  contents: write

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: issue-105-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/payments-1-reconciliation-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: codex/payments-1-reconciliation-v3
          fetch-depth: 0
      - name: Materialize digest-pinned implementation
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          from pathlib import Path
          import tarfile

          repository = Path.cwd().resolve()
          payload_dir = repository / '.github/issue-105-payload'
          encoded = ''.join(
              path.read_text().strip()
              for path in sorted(payload_dir.glob('part-*.txt'))
          )
          compressed = base64.b64decode(encoded, validate=True)
          expected = 'e6a70380c4146fd625c1d0ef50a4dabb7a10712cff30a5a5fa1eec19cfb685e3'
          actual = hashlib.sha256(compressed).hexdigest()
          if actual != expected:
              raise SystemExit(f'archive digest mismatch: {actual}')
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(compressed)), mode='r:') as archive:
              members = archive.getmembers()
              for member in members:
                  destination = (repository / member.name).resolve()
                  if repository not in destination.parents or not member.isfile():
                      raise SystemExit(f'unsafe archive member: {member.name}')
              archive.extractall(repository)
          PY
      - name: Commit exact implementation scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/scripts/stripe_reconciliation_report.py backend/scripts/live_billing_authorizations.py backend/tests/test_stripe_reconciliation_report.py backend/tests/test_live_billing_authorizations_cli.py backend/app/services/release_schema_readiness.py backend/tests/test_release_schema_readiness.py supabase/migrations/20260820170000_live_billing_reconciliation_v3.sql supabase/verification/studio_live_billing_authorizations_contract.sql
          git rm -- .github/workflows/issue-105-cloud-bootstrap.yml .github/workflows/issue-105-pr-bootstrap.yml .github/issue-105-payload/part-01.txt .github/issue-105-payload/part-02.txt .github/issue-105-payload/part-03.txt .github/issue-105-payload/part-04.txt
          git diff --cached --check
          git commit -m "fix(payments): add reconciliation checkpoint contract v3"
          git push origin HEAD:codex/payments-1-reconciliation-v3
