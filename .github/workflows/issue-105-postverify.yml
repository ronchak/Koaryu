name: Issue 105 post-verification confirmation

on:
  push:
    branches:
      - codex/payments-1-reconciliation-v3

permissions:
  contents: write
  pull-requests: write

jobs:
  confirm:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Confirm successful finalizer cleanup
        id: state
        run: |
          pending=0
          for path in \
            .github/workflows/issue-105-manifest-probe.yml \
            .github/workflows/issue-105-source-export.yml \
            .github/workflows/issue-105-finalize.yml \
            .github/workflows/issue-105-full-verify.yml \
            .github/workflows/issue-105-full-verify-v2.yml; do
            if test -e "$path"; then pending=1; fi
          done
          echo "verified=$((1-pending))" >> "$GITHUB_OUTPUT"
      - name: Mark the PR as exact-head verified
        if: steps.state.outputs.verified == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit 111 --repo "$GITHUB_REPOSITORY" \
            --title "payments: repair reconciliation and live authorization checkpoint contract"
          gh pr comment 111 --repo "$GITHUB_REPOSITORY" \
            --body "Exact-head cloud verification completed successfully. The temporary diagnostic workflows were removed after the full backend, frontend, database, generated/static, audit, and performance commands passed."
      - name: Remove this confirmation workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/issue-105-postverify.yml
          git commit -m "chore: remove issue 105 post-verification helper"
          git push origin HEAD:codex/payments-1-reconciliation-v3
