name: Issue 105 source export

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  export:
    if: github.event.pull_request.head.ref == 'codex/payments-1-reconciliation-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Archive exact cloud worktree
        run: tar --exclude=.git -czf /tmp/koaryu-issue-105.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: koaryu-issue-105-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/koaryu-issue-105.tar.gz
          if-no-files-found: error
          retention-days: 1
