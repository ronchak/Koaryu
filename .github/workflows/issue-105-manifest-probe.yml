name: Issue 105 finalizer

permissions:
  contents: write

on:
  push:
    branches:
      - codex/payments-1-reconciliation-v3
    paths:
      - .github/workflows/issue-105-manifest-probe.yml

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/payments-1-reconciliation-v3
          fetch-depth: 0
      - name: Apply verified issue 105 final patch
        run: |
          git apply --index .github/issue-105-final.patch
          git rm -f --ignore-unmatch \
            .github/issue-105-final.patch \
            .github/workflows/issue-105-manifest-probe.yml \
            .github/workflows/issue-105-source-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(payments): finalize reconciliation v3 contracts"
          git push origin HEAD:codex/payments-1-reconciliation-v3
