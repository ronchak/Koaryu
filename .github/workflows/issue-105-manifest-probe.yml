name: Issue 105 manifest probe

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  probe:
    if: github.event.pull_request.head.ref == 'codex/payments-1-reconciliation-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.95.4
      - name: Replay migrations and emit v19 manifests
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: supabase db start
      - name: Emit raw catalog state
        env:
          SUPABASE_DB_TARGET: local
        run: |
          node --input-type=module <<'NODE' > /tmp/issue-105-catalog.sql
          import { CATALOG_STATE_SQL } from './scripts/studio-comp-migration-rollout.mjs';
          process.stdout.write(CATALOG_STATE_SQL.trim() + '\n');
          NODE
          scripts/run-supabase-sql.sh /tmp/issue-105-catalog.sql
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
