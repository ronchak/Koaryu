name: Issue 105 SQL alias fix

permissions:
  contents: write

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/payments-1-reconciliation-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/payments-1-reconciliation-v3
          fetch-depth: 0
      - name: Replace reserved SQL alias
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260820170000_live_billing_reconciliation_v3.sql')
          text = path.read_text()
          replacements = {
              'FROM public.studio_live_billing_authorizations authorization':
                  'FROM public.studio_live_billing_authorizations authz',
              'JOIN public.studio_live_billing_authorizations authorization':
                  'JOIN public.studio_live_billing_authorizations authz',
              'authorization.': 'authz.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected SQL fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- supabase/migrations/20260820170000_live_billing_reconciliation_v3.sql
          git rm -- .github/workflows/issue-105-sql-fix.yml
          git diff --cached --check
          git commit -m "fix(db): avoid reserved authorization alias"
          git push origin HEAD:codex/payments-1-reconciliation-v3
