name: Issue 105 cloud bootstrap

permissions:
  contents: write

on:
  push:
    branches:
      - codex/payments-1-reconciliation-v3

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v7
        with:
          ref: codex/payments-1-reconciliation-v3
          fetch-depth: 0
      - name: Materialize reviewed implementation
        env:
          ARCHIVE_SHA256: e6a70380c4146fd625c1d0ef50a4dabb7a10712cff30a5a5fa1eec19cfb685e3
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import io
          from pathlib import Path
          import tarfile

          encoded = """"""
          compressed = base64.b64decode(encoded)
          expected = "e6a70380c4146fd625c1d0ef50a4dabb7a10712cff30a5a5fa1eec19cfb685e3"
          actual = hashlib.sha256(compressed).hexdigest()
          if actual != expected:
              raise SystemExit(f"archive digest mismatch: {actual}")

          repository = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(compressed)), mode="r:") as archive:
              members = archive.getmembers()
              for member in members:
                  destination = (repository / member.name).resolve()
                  if repository not in destination.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isfile():
                      raise SystemExit(f"unexpected archive member: {member.name}")
              archive.extractall(repository)
          PY
      - name: Commit exact implementation scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/scripts/stripe_reconciliation_report.py backend/scripts/live_billing_authorizations.py backend/tests/test_stripe_reconciliation_report.py backend/tests/test_live_billing_authorizations_cli.py backend/app/services/release_schema_readiness.py backend/tests/test_release_schema_readiness.py supabase/migrations/20260820170000_live_billing_reconciliation_v3.sql supabase/verification/studio_live_billing_authorizations_contract.sql
          git rm -- .github/workflows/issue-105-cloud-bootstrap.yml
          git diff --cached --check
          git commit -m "fix(payments): add reconciliation checkpoint contract v3"
          git push origin HEAD:codex/payments-1-reconciliation-v3
