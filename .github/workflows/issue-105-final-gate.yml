name: Issue 105 final exact-head gate

on:
  push:
    branches:
      - codex/payments-1-reconciliation-v3

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: issue-105-final-exact-head-gate
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.95.4

      - name: Install exact dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          npm --prefix frontend ci

      - name: Verify active schema-v3 source contract
        run: |
          python - <<'PY'
          from pathlib import Path

          active = [
              Path('backend/scripts/stripe_reconciliation_report.py'),
              Path('backend/scripts/live_billing_authorizations.py'),
              Path('supabase/migrations/20260820170000_live_billing_reconciliation_v3.sql'),
              Path('supabase/verification/studio_live_billing_authorizations_contract.sql'),
          ]
          contents = {path: path.read_text() for path in active}
          for path, source in contents.items():
              if '2026-07-13' in source or '2026-07-13T' in source:
                  raise SystemExit(f'legacy cutoff remains active in {path}')
          reporter = contents[active[0]]
          operator = contents[active[1]]
          migration = contents[active[2]]
          verification = contents[active[3]]
          if 'PROVIDER_EVENT_WINDOW' not in reporter:
              raise SystemExit('provider event-window margin is not centralized')
          if 'continuity' not in reporter or 'continuity' not in migration:
              raise SystemExit('schema-v3 continuity evidence is missing')
          rpc = 'record_stripe_live_billing_reconciliation_checkpoint_v3'
          if rpc not in operator or rpc not in migration or rpc not in verification:
              raise SystemExit('schema-v3 operator/database/verification RPC contract is incomplete')
          if 'row.get("connect")' in reporter or "row.get('connect')" in reporter:
              raise SystemExit('reporter still reads the nonexistent webhook endpoint connect field')
          PY

      - name: Verify dependency locks and generated API contract
        run: |
          python -m pip check
          (
            cd backend
            python -m piptools compile --quiet --generate-hashes --strip-extras --output-file requirements.txt requirements.in
            python -m piptools compile --quiet --generate-hashes --strip-extras --allow-unsafe --output-file requirements-dev.txt requirements-dev.in
          )
          git diff --exit-code -- backend/requirements.txt backend/requirements-dev.txt
          python scripts/generate-api-types.py --check

      - name: Run repository controls
        run: |
          npm run check:release-workflow
          npm run check:env-examples
          npm run audit:support-privacy

      - name: Run full backend suite
        run: |
          set -o pipefail
          cd backend
          python -m pytest tests | tee /tmp/backend-tests.log
          grep -E '[0-9]+ passed' /tmp/backend-tests.log | tail -1 > /tmp/backend-result.txt

      - name: Run full frontend suite
        run: |
          set -o pipefail
          npm --prefix frontend test | tee /tmp/frontend-tests.log
          { grep -E '^# (tests|pass|fail) ' /tmp/frontend-tests.log || true; } | tr '\n' ';' > /tmp/frontend-result.txt
          npm --prefix frontend run lint
          cd frontend
          set -a
          source .env.example
          set +a
          npm run build

      - name: Run dependency audits
        run: |
          python -m pip_audit -r backend/requirements.txt
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Start disposable local database
        run: supabase db start

      - name: Replay and lint complete migration chain
        run: |
          supabase db reset --local
          supabase db lint --local --fail-on error

      - name: Run complete database contract surface
        env:
          SUPABASE_DB_TARGET: local
        run: |
          scripts/verify-supabase-contracts.sh
          scripts/verify-connect-identity-concurrency.sh
          scripts/verify-core-checkout-accept-reserve-concurrency.sh
          scripts/verify-student-profile-rank-plan-concurrency.sh

      - name: Stop disposable local database
        if: always()
        run: supabase stop --no-backup

      - name: Run deterministic performance gate
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          KOARYU_PERFORMANCE_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: npm run check:performance-regression -- --expected-sha "$EXPECTED_HEAD_SHA"

      - name: Run backend static analysis
        run: python -m bandit -r backend/app -ll

      - name: Assert verification did not alter source
        run: git diff --exit-code

      - name: Publish focused PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BACKEND_RESULT=$(cat /tmp/backend-result.txt)
          FRONTEND_RESULT=$(cat /tmp/frontend-result.txt)
          cat > /tmp/pr-body.md <<EOF
          Closes #105

          ## Verified root cause

          The active v2 reporter, checkpoint writer, authorization functions, verification SQL, and tests promoted a one-time migration boundary into a permanent provider-history invariant. Stripe cannot return that history indefinitely, so exact provider/local equality eventually became impossible even for a healthy deployment. The endpoint topology check separately depended on a response-side `connect` property that Stripe Webhook Endpoint objects do not return.

          ## Exact new contract

          Schema v3 uses a centralized, explicitly bounded provider-supported rolling event window with a documented retention margin. An older requested start fails instead of being silently truncated. Provider/local `(event ID, account context)` equality inside that complete window remains exact, with zero provider-only, local-only, failed, nonterminal, unmapped, wrong-mode, or stale-generation evidence.

          Continuity is durable and explicit. A continuing checkpoint binds a valid, unexpired accepted v3 predecessor, proves overlap with its accepted window, and requires a non-regressing local ingest watermark. The first v3 checkpoint uses a separately labeled bootstrap rule that proves only the accessible supported window and cannot claim inaccessible history. Once a v3 checkpoint exists, later reports cannot silently return to bootstrap.

          Webhook topology uses only retrievable provider fields and independently readable delivery context. The exact platform and Connect URLs must each exist once, be enabled, be in the expected livemode, and match their exact enabled-event sets. Fresh platform event context proves the platform surface, and fresh mapped connected-account event context proves the Connect surface. Missing, duplicate, disabled, misrouted, wildcard, drifted, or unexpected enabled endpoints fail closed.

          The accepted checkpoint remains bound to the exact deployed candidate SHA, pinned production readiness URL, Stripe live mode, source report digest, checkpoint expiry, local ingest watermark, every mapped account and generation, and fresh per-surface evidence. `LIVE_BILLING_ENABLED=true` remains useless without the complete database authorization chain.

          ## Migration and compatibility behavior

          `supabase/migrations/20260820170000_live_billing_reconciliation_v3.sql` is additive. No historical migration was edited. Existing v2 rows remain readable for audit, but the v2 writer is no longer executable by the service role and active authorization accepts only schema-v3 checkpoints. Exact-head release readiness advances to the new migration while browser roles remain denied from checkpoint, evidence, authorization, and operator surfaces.

          ## Failure and continuity behavior

          Missing or expired predecessors, broken overlap, regressed watermarks, stale SHA, wrong mode, account or generation drift, provider/local gaps, nonterminal or failed events, unresolved accounts, endpoint topology drift, stale delivery evidence, and post-checkpoint bad events all deny checkpointing or runtime authorization. The database rechecks current state atomically at checkpoint record, grant binding, and live mutation authorization.

          ## Tests and exact final results

          Exact tested source head: `${GITHUB_SHA}`

          * Full backend suite: `${BACKEND_RESULT}`
          * Full frontend tests: `${FRONTEND_RESULT}`
          * Frontend lint and production build: passed
          * Full migration replay and schema lint: passed
          * Every Supabase verification SQL file and all three database concurrency proofs: passed against a disposable local database
          * Release-workflow, environment-example, support-privacy, generated API, dependency-lock, dependency-audit, deterministic-performance, and Bandit checks: passed
          * Active-v3 static contract check: passed with no operational legacy cutoff literal and no nonexistent Webhook Endpoint `connect` readback

          No command contacted or mutated production Stripe or production Supabase.

          ## Deployment and operator implications

          Merge grants nothing and records no checkpoint. The next sequence remains an exact-candidate staging test-mode rehearsal, an approved production read-only reconciliation, explicit v3 checkpoint recording, an operation-bounded studio grant owned by the later authorization workstream, and a separately approved financial canary. Reporter collection and dry-run operator commands remain read-only.

          ## Dependencies and non-goals

          This is Payments 1/6 from PR #110. It is foundational for later operation-level authorization and independent of PR #75's refund/dispute accounting convergence. It does not expose billing controls, alter the 0.5% fee, redesign enrollment or payer consent, merge PR #75, grant a studio, change production Stripe configuration, record a production checkpoint, enable another live mutation, or move money.
          EOF
          gh pr edit 111 --repo "$GITHUB_REPOSITORY" \
            --title "payments: repair reconciliation and live authorization checkpoint contract" \
            --body-file /tmp/pr-body.md

      - name: Remove every cloud-only workflow and mark final head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch \
            .github/workflows/issue-105-manifest-probe.yml \
            .github/workflows/issue-105-source-export.yml \
            .github/workflows/issue-105-finalize.yml \
            .github/workflows/issue-105-full-verify.yml \
            .github/workflows/issue-105-full-verify-v2.yml \
            .github/workflows/issue-105-postverify.yml \
            .github/workflows/issue-105-postverify-2.yml \
            .github/workflows/issue-105-final-gate.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove issue 105 cloud diagnostics"
            git push origin HEAD:codex/payments-1-reconciliation-v3
          fi
          FINAL_SHA=$(git rev-parse HEAD)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
            -f state=success \
            -f context='Issue 105 exact-head verification' \
            -f description='Full isolated backend, frontend, database, contract, audit, and performance verification passed'
          gh pr comment 111 --repo "$GITHUB_REPOSITORY" \
            --body "Issue 105 exact-head verification passed. The final cleanup commit is marked with the dedicated success status, and all temporary cloud workflows were removed."
