name: Issue 105 completed-verification confirmation

on:
  push:
    branches:
      - codex/payments-1-reconciliation-v3

permissions:
  contents: write
  pull-requests: write

jobs:
  confirm:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Detect finalizer state
        id: state
        run: |
          pending=0
          for path in \
            .github/workflows/issue-105-manifest-probe.yml \
            .github/workflows/issue-105-source-export.yml \
            .github/workflows/issue-105-finalize.yml \
            .github/workflows/issue-105-full-verify.yml \
            .github/workflows/issue-105-full-verify-v2.yml; do
            test ! -e "$path" || pending=1
          done
          echo "verified=$((1-pending))" >> "$GITHUB_OUTPUT"
      - name: Publish success confirmation
        if: steps.state.outputs.verified == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr view 111 --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | contains("Issue 105 exact-head verification is complete")] | any')
          if test "$existing" != true; then
            gh pr comment 111 --repo "$GITHUB_REPOSITORY" \
              --body "Issue 105 exact-head verification is complete. All temporary cloud diagnostics have been removed from the branch."
          fi
      - name: Remove confirmation helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/issue-105-postverify-2.yml
          git commit -m "chore: remove issue 105 completion helper"
          git push origin HEAD:codex/payments-1-reconciliation-v3
