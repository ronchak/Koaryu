name: API contracts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/api-contracts.yml"
      - "backend/**"
      - "frontend/src/types/generated/api-contracts.ts"
      - "scripts/generate-api-types.py"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-contracts.yml"
      - "backend/**"
      - "frontend/src/types/generated/api-contracts.ts"
      - "scripts/generate-api-types.py"
      - "package.json"

jobs:
  check-api-types:
    name: Check generated frontend API types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify generated API contract types
        run: python scripts/generate-api-types.py --check
