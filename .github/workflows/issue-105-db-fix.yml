name: Issue 105 database contract finalizer

permissions:
  contents: write

on:
  push:
    branches:
      - codex/payments-1-reconciliation-v3
    paths:
      - .github/workflows/issue-105-db-fix.yml

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/payments-1-reconciliation-v3
          fetch-depth: 0
      - name: Apply verified database contract fix
        run: |
          git apply --index .github/issue-105-db-fix.patch
          git rm -f \
            .github/issue-105-db-fix.patch \
            .github/workflows/issue-105-db-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(payments): align final v3 database contracts"
          git push origin HEAD:codex/payments-1-reconciliation-v3
